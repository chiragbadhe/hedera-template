name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn shared:build
      - run: yarn check-types
      - run: yarn lint
      - run: yarn test
      - run: yarn build
